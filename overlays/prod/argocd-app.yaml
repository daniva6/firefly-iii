apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly
  namespace: argocd
spec:
  destination:
    name: ''
    namespace: firefly
    server: https://kubernetes.default.svc
  project: default
  source:
    path: overlays/prod
    repoURL: https://github.com/daniva6/firefly-iii.git
    targetRevision: v1.0.1
  syncPolicy:
    syncOptions:
    - CreateNamespace=true      