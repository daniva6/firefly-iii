apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-tls
  annotations:
    avp.kubernetes.io/path: "k8s-secrets/data/firefly"    
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host("<url>")
      kind: Rule
      services:
        - name: firefly-iii
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly
  annotations:
    avp.kubernetes.io/path: "k8s-secrets/data/firefly"  
spec:
  entryPoints:
    - web
  routes:
    - match: Host("<url>")
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: firefly-iii
          port: 8080

