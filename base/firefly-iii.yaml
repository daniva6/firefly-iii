apiVersion: v1
kind: Service
metadata:
    name: firefly-iii
    labels:
        app: firefly-iii
spec:
    clusterIP: None
    ports:
      - port: 8080
    selector:
        app: firefly-iii
        tier: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: firefly-iii
    labels:
        app: firefly-iii
spec:
    selector:
        matchLabels:
            app: firefly-iii
            tier: frontend
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                app: firefly-iii
                tier: frontend
        spec:
            containers:
              - image: fireflyiii/core:version-6.2.9              
                name: firefly-iii
                env:
                  - name: APP_ENV
                    value: "local"
                  - name: APP_KEY
                    valueFrom:
                        secretKeyRef:
                          name: firefly-iii
                          key: app_key
                  - name: DB_HOST
                    value:  firefly-mariadb
                  - name: DB_CONNECTION
                    value: mysql
                  - name: DB_DATABASE
                    value: "fireflyiii"
                  - name: DB_USERNAME
                    valueFrom:
                        secretKeyRef:
                          name: mariadb
                          key: db-username
                  - name: DB_PASSWORD
                    valueFrom:
                        secretKeyRef:
                          name: mariadb
                          key: db-password
                  - name: TRUSTED_PROXIES
                    value: "**"
                  - name: MAIL_MAILER
                    value: "log"
                  - name: MAIL_HOST
                    valueFrom:
                        secretKeyRef:
                          name: firefly-iii
                          key: mail_host
                  - name: MAIL_PORT
                    value: "465"
                  - name: MAIL_FROM
                    valueFrom:
                        secretKeyRef:
                          name: firefly-iii
                          key: mail_from
                  - name: MAIL_USERNAME
                    valueFrom:
                        secretKeyRef:
                          name: firefly-iii
                          key: mail_username
                  - name: MAIL_PASSWORD
                    valueFrom:
                        secretKeyRef:
                          name: firefly-iii
                          key: mail_password
                  - name: MAIL_ENCRYPTION
                    value: "null"
                ports:
                  - containerPort: 8080
                    name: firefly-iii
                volumeMounts:
                  - mountPath: /var/www/html/storage/upload
                    name: firefly-iii
            volumes:
              - name: firefly-iii
                persistentVolumeClaim:
                    claimName: firefly-iii
