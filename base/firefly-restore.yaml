apiVersion: k8s.mariadb.com/v1alpha1
kind: Restore
metadata:
  name: firefly-restore
  namespace: firefly
spec:
  mariaDbRef:
    name: firefly-mariadb
  backupRef:
    name: firefly-backup
  inheritMetadata:
    labels:
      sidecar.istio.io/inject: "false"
  serviceAccountName: restore
  args:
    - "--verbose"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
