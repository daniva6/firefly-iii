apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-importer-tls
  annotations:
    avp.kubernetes.io/path: "k8s-secrets/data/firefly" 
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`<url-importer>`)
    services:
    - name: firefly-iii-importer
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-importer
  annotations:
    avp.kubernetes.io/path: "k8s-secrets/data/firefly" 
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`<url-importer>`)
    middlewares:
    - name: redirect-https
      namespace: traefik
    services:
    - name: firefly-iii-importer
      port: 8080
